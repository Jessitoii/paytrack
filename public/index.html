<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayTrack API &amp; PSD2 Open Banking Gateway</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1120;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background-color: #131C31;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      margin: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .link-btn {
      color: #38BDF8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border: 1px solid #1E293B;
      border-radius: 8px;
      background-color: #0B1120;
      transition: border-color 0.2s;
    }
    .link-btn:hover {
      border-color: #38BDF8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Operational &bull; Serverless API</div>
    <h1>PayTrack Open Banking Gateway</h1>
    <p>This deployment hosts the stateless Serverless API and PSD2 Open Banking integration for the PayTrack personal finance application.</p>
    <div class="links">
      <a href="/api/bank/health" class="link-btn">Health Status</a>
      <a href="/privacy" class="link-btn">Privacy Policy</a>
      <a href="/terms" class="link-btn">Terms of Use</a>
    </div>
  </div>
</body>
</html>
